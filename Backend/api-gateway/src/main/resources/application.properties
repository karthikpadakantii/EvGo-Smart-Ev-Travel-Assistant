spring.application.name=API-GATEWAY
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# USER SERVICE
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# USER SERVICE - VEHICLES (VehicleController exposes /vehicles/{id} directly,
# which does NOT fall under /api/users/**, so it needs its own route or every
# PUT/DELETE vehicle call 404s at the gateway)
spring.cloud.gateway.server.webflux.routes[1].id=user-service-vehicles
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/vehicles/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# JOURNEY SERVICE
spring.cloud.gateway.server.webflux.routes[2].id=journey-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://JOURNEY-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/journeys/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# CHARGING SERVICE
spring.cloud.gateway.server.webflux.routes[3].id=charging-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CHARGING-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/reservations/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

# INTEGRATION SERVICE
spring.cloud.gateway.server.webflux.routes[4].id=integration-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://INTEGRATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/integration/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

management.endpoints.web.exposure.include=*
management.endpoint.gateway.access=unrestricted
management.endpoint.health.show-details=always

# CORS - note the server.webflux namespace, matching the routes above
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true